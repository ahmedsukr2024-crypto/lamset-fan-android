name: Build LAMSET FAN Preview APK
run-name: Build preview APK - ${{ github.ref_name }}

on:
  push:
    branches:
      - work/lamset-fan-ui-and-business-upgrade
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Validate application JavaScript
        run: npm run check:all

      - name: Generate Android project when missing
        run: |
          if [ ! -f android/gradlew ]; then
            npx cap add android
          fi

      - name: Build debug APK
        run: npm run build:android

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: lamset-fan-android-preview
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
