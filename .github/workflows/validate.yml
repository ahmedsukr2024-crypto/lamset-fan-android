name: Validate App JavaScript

on:
  push:
    branches:
      - work/lamset-fan-ui-and-business-upgrade
  pull_request:
    branches:
      - work/lamset-fan-ui-and-business-upgrade

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate inline JavaScript
        run: node scripts/check-inline-js.cjs && node --check www/mobile-bridge.js
