name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/facebook-tajawal-theme-2026-11-14

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Validate application scripts and catalog privacy
        run: npm run check:all

      - name: Build debug APK
        run: npm run build:android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lamset-fan-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Package complete project source and generated Android project
        run: zip -r lamset-fan-complete-project.zip . -x ".git/*" "node_modules/*" "android/.gradle/*" "android/app/build/*"

      - name: Upload complete project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: lamset-fan-complete-project
          path: lamset-fan-complete-project.zip
          if-no-files-found: error
