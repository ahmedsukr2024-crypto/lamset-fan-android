name: Build LAMSET FAN Android APK

on:
  push:
    branches:
      - work/lamset-fan-ui-and-business-upgrade
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install JavaScript dependencies
        run: npm install

      - name: Validate inline application JavaScript
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('www/index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script\s*>/gi)];
          let checked = 0;
          for (const [index, match] of scripts.entries()) {
            if (/\bsrc\s*=/.test(match[1])) continue;
            const type = (match[1].match(/\btype\s*=\s*[\"']?([^\"'\s>]+)/i) || [])[1] || 'classic';
            if (type !== 'classic' && type !== 'module') continue;
            try { new Function(match[2]); }
            catch (error) { console.error(`Inline script ${index + 1} syntax error:`, error); process.exitCode = 1; }
            checked++;
          }
          if (process.exitCode) process.exit(process.exitCode);
          console.log(`Validated ${checked} inline JavaScript blocks.`);
          NODE

      - name: Generate Android project when missing
        run: |
          if [ ! -f android/gradlew ]; then
            npx cap add android
          fi

      - name: Build debug APK
        run: npm run build:android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lamset-fan-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
