name: Build LAMSET FAN Android APK

on:
  push:
    branches:
      - test/known-good-build-18ae7b0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install JavaScript dependencies
        run: npm install

      - name: Validate inline application JavaScript
        run: npm run check:all

      - name: Generate Android project when missing
        run: |
          if [ ! -f android/gradlew ]; then
            npx cap add android
          fi

      - name: Build debug APK
        run: npm run build:android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lamset-fan-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
