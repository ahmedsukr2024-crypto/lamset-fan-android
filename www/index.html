<head>

function lamsetPrintThemeTag(){return '<style id="lf-header-system-v1">
:root{--lf-header-safe-top:env(safe-area-inset-top,0px);--lf-header-height:78px}
@media(max-width:699px){:root{--lf-header-safe-top:max(env(safe-area-inset-top,0px),30px);--lf-header-height:70px}}
